name: empleados_app
description: App para ver empleados desde Supabase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.8
  provider: ^6.1.2
  intl: ^0.19.0

dependency_overrides:
  meta: ^1.14.0
  web: ^1.1.0
  web_socket: ^0.1.6
  stream_channel: ^2.1.4
  source_span: ^1.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
