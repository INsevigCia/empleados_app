name: empleados_app
description: App para ver empleados desde Supabase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.8
  provider: ^6.1.2
  intl: ^0.19.0

dependency_overrides:
  # Core web dependencies
  web: ^1.1.0
  web_socket: ^0.1.6
  
  # URL launcher family - usando versiones que existen
  url_launcher: ^6.2.6
  url_launcher_android: ^6.3.2
  url_launcher_ios: ^6.2.5
  url_launcher_web: ^2.3.1
  url_launcher_windows: ^3.1.1
  
  # Stream and async
  stream_channel: ^2.1.4
  source_span: ^1.10.1
  
  # Data types
  typed_data: ^1.4.0
  vector_math: ^2.2.0
  
  # Core meta
  meta: ^1.14.0
  
  # VM service
  vm_service: ^14.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
