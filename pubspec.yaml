name: empleados_app
description: App para ver empleados desde Supabase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # supabase_flutter: ^2.5.8  # TEMPORALMENTE COMENTADO
  provider: ^6.1.2
  intl: ^0.19.0
  http: ^1.2.1

dependency_overrides:
  # Core web dependencies
  web: ^1.1.0
  web_socket: ^0.1.6
  
  # Stream and async
  stream_channel: ^2.1.4
  source_span: ^1.10.1
  stack_trace: ^1.11.1
  
  # Data types and math
  typed_data: ^1.4.0
  vector_math: ^2.1.4
  
  # Core dependencies - FIXED VERSION
  meta: ^1.14.0
  collection: ^1.18.0
  material_color_utilities: ^0.8.0
  
  # VM and services
  vm_service: ^14.2.4
  
  # HTTP and networking
  http: ^1.2.1
  http_parser: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
