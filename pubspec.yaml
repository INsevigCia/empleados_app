name: empleados_app
description: App para ver empleados desde Supabase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.8
  provider: ^6.1.2
  intl: ^0.19.0

dependency_overrides:
  # SOLUCIÓN RADICAL: Usar supabase más básico sin app_links
  supabase_flutter: ^2.0.0
  
  # Core web dependencies
  web: ^1.1.0
  web_socket: ^0.1.6
  
  # URL launcher family
  url_launcher: ^6.2.6
  url_launcher_android: ^6.3.2
  url_launcher_ios: ^6.2.5
  url_launcher_web: ^2.3.1
  url_launcher_windows: ^3.1.1
  
  # Stream and async
  stream_channel: ^2.1.4
  source_span: ^1.10.1
  stack_trace: ^1.11.1
  
  # Data types and math
  typed_data: ^1.4.0
  vector_math: ^2.1.4
  
  # Core dependencies
  meta: ^1.14.0
  collection: ^1.18.0
  material_color_utilities: ^0.8.0
  
  # VM and services
  vm_service: ^14.2.4
  
  # HTTP and networking
  http: ^1.2.1
  http_parser: ^4.0.2
  
  # Platform specific
  path_provider: ^2.1.3
  path_provider_android: ^2.2.5
  path_provider_foundation: ^2.4.0
  path_provider_linux: ^2.2.1
  path_provider_windows: ^2.2.1
  
  # Additional common packages
  shared_preferences: ^2.2.3
  shared_preferences_android: ^2.2.2
  shared_preferences_foundation: ^2.4.0
  shared_preferences_linux: ^2.3.2
  shared_preferences_web: ^2.3.0
  shared_preferences_windows: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
