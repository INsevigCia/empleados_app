name: empleados_app
description: App para ver empleados desde Supabase
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.5.8
  provider: ^6.1.2
  intl: ^0.19.0

dependency_overrides:
  web: ^1.1.0
  web_socket: ^0.1.6
  stream_channel: ^2.1.4
  stack_trace: ^1.12.1
  source_span: ^1.10.1
  string_scanner: ^1.4.1
  term_glyph: ^1.2.2
  test_api: ^0.7.6
  typed_data: ^1.4.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
